name: Build and Push Backend API to Docker Hub and ECR

on:
  push:
    branches:
      - master
      - develop
  workflow_run:
    workflows: ["Checks"]
    branches: ["master", "develop"]
    types: [completed]

env:
  # TODO: Uncomment this when we have the AWS credentials
  # AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  # AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
  # ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  # AWS_ROLE_NAME: ${{ vars.AWS_ROLE_NAME }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

jobs:
  build-and-push-backend:
    name: Build and Push Backend API Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    permissions:
      # id-token: write  # TODO: Uncomment this when we have the AWS credentials if we use AWS OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Get version
        id: version
        run: echo "VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ steps.version.outputs.VERSION }}" >> $GITHUB_OUTPUT
          fi

      - name: Create .env-issuer
        run: touch .env-issuer

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            issuernode-api:${{ steps.version.outputs.VERSION }}
            issuernode-api:${{ steps.tag.outputs.TAG }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Push to Docker Hub
        run: |
          docker tag issuernode-api:${{ steps.version.outputs.VERSION }} energyweb/issuernode-api:${{ steps.version.outputs.VERSION }}
          docker tag issuernode-api:${{ steps.tag.outputs.TAG }} energyweb/issuernode-api:${{ steps.tag.outputs.TAG }}
          docker push energyweb/issuernode-api:${{ steps.version.outputs.VERSION }}
          docker push energyweb/issuernode-api:${{ steps.tag.outputs.TAG }}

      - name: Configure AWS credentials
        if: false # TODO: Uncomment this when we have the AWS credentials
        uses: aws-actions/configure-aws-credentials@v1-node16
        with:
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ROLE_NAME }}
          role-session-name: GitHubActionsSession

      - name: Login to Amazon ECR
        if: false # TODO: Uncomment this when we have the AWS credentials
        uses: aws-actions/amazon-ecr-login@v1
        id: login-ecr

      - name: Push to ECR
        if: false # TODO: Uncomment this when we have the AWS credentials
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag issuernode-api:${{ steps.version.outputs.VERSION }} ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.VERSION }}
          docker tag issuernode-api:${{ steps.tag.outputs.TAG }} ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.TAG }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.VERSION }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.TAG }}
